name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Reuse the same build key between runs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: video-notes-build-key-v1

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/*.apk VideoNotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoNotes-apk
          path: VideoNotes.apk

      - name: Publish to Releases (tap to download on your phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" VideoNotes.apk \
            --title "Video Notes 1.0.${{ github.run_number }}" \
            --notes "Tap VideoNotes.apk to download and install." --latest
